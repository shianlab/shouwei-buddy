# 收尾搭子 · dsh 运行时基础 patch（模板）
#
# connection.ts 在本模板基础上注入 system-prompt（personaPrefix）
# 与 llm-pi-ai（用户模型提供方路由）两行配置。
#
# 本文件语义：禁用 dsh-base 中所有会向模型暴露工具的行。
# 模型因此没有 shell、文件读写、联网搜索与子代理能力，只能进行只读文本分析。
# 行清单需与 packages/harness-adapter/src/connection.ts 的 TOOL_ROW_IDS 保持一致。

