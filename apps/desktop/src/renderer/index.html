<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>收尾搭子</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f7f2;
        color: #222823;
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .card {
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        color: #35624b;
      }
      p {
        margin: 0 0 20px;
        color: #5a6359;
      }
      button {
        border: 1px solid #35624b;
        border-radius: 8px;
        background: #35624b;
        color: #fff;
        padding: 8px 20px;
        font-size: 14px;
        cursor: pointer;
      }
      button:hover {
        background: #2c5340;
      }
      #result {
        margin-top: 14px;
        font-size: 13px;
        color: #795012;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>收尾搭子</h1>
      <p>差最后一点？一起收好。</p>
      <button id="ping" type="button">测试主进程往返</button>
      <div id="result"></div>
    </div>
    <script>
      document.getElementById('ping').addEventListener('click', async () => {
        const reply = await window.shouwei.ping()
        document.getElementById('result').textContent = '主进程回复：' + reply
      })
    </script>
  </body>
</html>
